# Deploy configuration — committed to git (no secrets here).
#
# Uses ${VAR:-value} so an env var set before running the script always wins:
#   DEPLOY_HOST=staging-server ./scripts/deploy.sh   ← overrides this file

DEPLOY_HOST="${DEPLOY_HOST:-your-server.com}"    # ← replace with real IP or hostname
DEPLOY_USER="${DEPLOY_USER:-deploy}"
DEPLOY_PATH="${DEPLOY_PATH:-/srv/legal}"
LOCALES="${LOCALES:-en_US}"                      # space-separated: "en_US uk_UA"
KEEP_BUILDS="${KEEP_BUILDS:-3}"
