<div class="field required uho-np-field uho-np-warehouse" data-bind="css: { 'uho-np-disabled': !isEnabled() }">
    <label class="label">
        <span translate="'Warehouse'"></span>
    </label>
    <div class="control uho-np-typeahead">
        <input type="text"
               class="input-text"
               autocomplete="off"
               data-bind="
                   value: query,
                   valueUpdate: 'input',
                   enable: isEnabled,
                   attr: {
                       placeholder: isEnabled() ? $t('Start typing a warehouse address or number…') : $t('Choose a city first')
                   },
                   event: { blur: closeDropdown, focus: openDropdown }
               "/>
        <!-- ko if: isLoading -->
        <span class="uho-np-spinner"></span>
        <!-- /ko -->
        <ul class="uho-np-suggestions" data-bind="visible: isOpen() && suggestions().length">
            <!-- ko foreach: suggestions -->
            <li data-bind="text: label, click: $parent.selectWarehouse.bind($parent)"></li>
            <!-- /ko -->
        </ul>
        <!-- ko if: isEnabled() && isOpen() && !isLoading() && suggestions().length === 0 -->
        <div class="uho-np-empty" translate="'No warehouses found'"></div>
        <!-- /ko -->
    </div>
</div>
