; OPcache settings for local development
; validate_timestamps=1 + revalidate_freq=0 means PHP checks for file changes
; on every request — necessary when you edit code in the container.

opcache.enable                  = 1
opcache.memory_consumption      = 512
opcache.interned_strings_buffer = 64
opcache.max_accelerated_files   = 100000
opcache.validate_timestamps     = 1
opcache.revalidate_freq         = 0
opcache.save_comments           = 1

; Warden mounts code via bind; consistency mode needs no extra config.
