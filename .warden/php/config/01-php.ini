; General PHP settings for Magento 2 local development

memory_limit             = 2G
max_execution_time       = 1800
max_input_time           = 1800
max_input_vars           = 10000
upload_max_filesize      = 64M
post_max_size            = 64M

realpath_cache_size      = 10M
realpath_cache_ttl       = 7200

date.timezone            = Europe/Kyiv

; Show all errors to the browser in dev
display_errors           = On
display_startup_errors   = On
error_reporting          = E_ALL & ~E_DEPRECATED

; Also log PHP-level errors (separate from Magento's var/log)
log_errors               = On
error_log                = /var/www/html/var/log/php-errors.log
