; Production PHP settings for Magento 2

memory_limit             = 2G
max_execution_time       = 1800
max_input_time           = 1800
max_input_vars           = 10000
upload_max_filesize      = 64M
post_max_size            = 64M

realpath_cache_size      = 10M
realpath_cache_ttl       = 7200

date.timezone            = Europe/Kyiv

; Hide errors from browser in production
display_errors           = Off
display_startup_errors   = Off
error_reporting          = E_ALL & ~E_DEPRECATED & ~E_STRICT
log_errors               = On
error_log                = /var/www/html/var/log/php-errors.log

; OPcache — production: skip timestamp checks, maximum performance
opcache.enable                  = 1
opcache.memory_consumption      = 512
opcache.interned_strings_buffer = 64
opcache.max_accelerated_files   = 100000
opcache.validate_timestamps     = 0
opcache.save_comments           = 1
