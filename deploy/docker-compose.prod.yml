# Production Docker Compose — Magento Open Source 2.4.9
#
# Application code lives on the host filesystem at APP_ROOT (set in .env.prod).
# Docker containers provide PHP/nginx runtime only — code is NOT baked into images.
# Deployment is handled by scripts/deploy.sh (build locally → tar → push → swap).
#
# Usage (from /srv/legal/repo/):
#   docker compose -f deploy/docker-compose.prod.yml --env-file /srv/legal/.env.prod up -d

name: legal

services:

  ##############################################################################
  # Varnish — full-page HTTP cache
  # Built once (VCL config only, no app code). Rebuild only when VCL changes.
  ##############################################################################
  varnish:
    build:
      context: ./varnish
    restart: always
    depends_on:
      - nginx
    ports:
      - "127.0.0.1:6081:6081"
    networks:
      - internal

  ##############################################################################
  # Nginx — static file serving + FastCGI proxy
  # Config mounted from repo; pub/ mounted from active build.
  ##############################################################################
  nginx:
    image: nginx:1.26-alpine
    restart: always
    depends_on:
      - php-fpm
    networks:
      - internal
    volumes:
      - ${APP_ROOT}/pub:/var/www/html/pub:ro
      - ${SHARED_MEDIA}:/var/www/html/pub/media:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/magento.conf:/etc/nginx/conf.d/default.conf:ro

  ##############################################################################
  # PHP-FPM — Magento application runtime
  # Code mounted from active build at APP_ROOT.
  ##############################################################################
  php-fpm:
    image: wardenenv/php-fpm:8.4-magento2
    restart: always
    depends_on:
      db:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - internal
    volumes:
      - ${APP_ROOT}:/var/www/html
      - ${SHARED_MEDIA}:/var/www/html/pub/media
      - ${SHARED_LOGS}:/var/www/html/var/log
      - ./php/php.ini:/usr/local/etc/php/conf.d/99-magento-prod.ini:ro
    environment:
      - MAGE_MODE=production

  ##############################################################################
  # Cron — Magento scheduled tasks (same image/code as php-fpm)
  ##############################################################################
  cron:
    image: wardenenv/php-fpm:8.4-magento2
    restart: always
    depends_on:
      - php-fpm
    networks:
      - internal
    volumes:
      - ${APP_ROOT}:/var/www/html
      - ${SHARED_MEDIA}:/var/www/html/pub/media
      - ${SHARED_LOGS}:/var/www/html/var/log
    environment:
      - MAGE_MODE=production
    command: >
      bash -c "while true; do
        php /var/www/html/bin/magento cron:run 2>&1;
        sleep 60;
      done"

  ##############################################################################
  # phpMyAdmin — DB admin UI (bind to localhost only; access via SSH tunnel)
  ##############################################################################
  phpmyadmin:
    image: phpmyadmin:5-apache
    restart: always
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    ports:
      - "127.0.0.1:8080:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      UPLOAD_LIMIT: 256M

  ##############################################################################
  # MariaDB 11.4
  ##############################################################################
  db:
    image: mariadb:11.4
    restart: always
    networks:
      - internal
    volumes:
      - dbdata:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    command:
      - mariadbd
      - --max_allowed_packet=1024M
      - --explicit_defaults_for_timestamp=on
      - --innodb_buffer_pool_size=512M
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  ##############################################################################
  # OpenSearch 2.19
  ##############################################################################
  opensearch:
    image: opensearchproject/opensearch:2.19.0
    restart: always
    networks:
      - internal
    volumes:
      - osdata:/usr/share/opensearch/data
    environment:
      - discovery.type=single-node
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
      - DISABLE_SECURITY_PLUGIN=true
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile:  { soft: 65536, hard: 65536 }
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  ##############################################################################
  # Valkey 8 — cache, FPC, sessions
  ##############################################################################
  redis:
    image: valkey/valkey:8-alpine
    restart: always
    networks:
      - internal
    volumes:
      - redisdata:/data
    command: valkey-server --save 60 1 --loglevel warning

  ##############################################################################
  # RabbitMQ 3.13 — async queue
  ##############################################################################
  rabbitmq:
    image: rabbitmq:3.13-alpine
    restart: always
    networks:
      - internal
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

##############################################################################
networks:
  internal:
    name: legal_internal

##############################################################################
volumes:
  dbdata:
  osdata:
  redisdata:
  rabbitmqdata:
