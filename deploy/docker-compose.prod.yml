# Production Docker Compose — Magento Open Source 2.4.9
#
# SSL termination is handled by the server-level nginx (outside Docker).
# Varnish is the only service exposed — bound to localhost:6081 so the
# host nginx can proxy to it. Everything else is on an isolated internal network.
#
# Usage (from repo root):
#   docker compose -f deploy/docker-compose.prod.yml --env-file .env.prod up -d

name: legal

services:

  ##############################################################################
  # Varnish — full-page HTTP cache
  # Exposed on 127.0.0.1:6081 only — reachable by the host nginx, not the internet.
  ##############################################################################
  varnish:
    build:
      context: ./varnish
      dockerfile: Dockerfile
    restart: always
    depends_on:
      - nginx
    ports:
      - "127.0.0.1:6081:6081"
    networks:
      - internal

  ##############################################################################
  # Nginx — static files + FastCGI proxy to php-fpm
  ##############################################################################
  nginx:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: nginx-runtime
    restart: always
    depends_on:
      - php-fpm
    networks:
      - internal
    volumes:
      - media:/var/www/html/pub/media

  ##############################################################################
  # PHP-FPM — Magento application
  ##############################################################################
  php-fpm:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: php-runtime
      secrets:
        - composer_auth
    restart: always
    depends_on:
      db:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - internal
    volumes:
      - media:/var/www/html/pub/media
      - logs:/var/www/html/var/log
    environment:
      - MAGE_MODE=production

  ##############################################################################
  # Cron — Magento scheduled tasks (runs bin/magento cron:run every 60s)
  ##############################################################################
  cron:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: php-runtime
    restart: always
    depends_on:
      - php-fpm
    networks:
      - internal
    volumes:
      - media:/var/www/html/pub/media
      - logs:/var/www/html/var/log
    environment:
      - MAGE_MODE=production
    command: >
      bash -c "while true; do
        php /var/www/html/bin/magento cron:run 2>&1;
        sleep 60;
      done"

  ##############################################################################
  # MariaDB 11.4
  ##############################################################################
  db:
    image: mariadb:11.4
    restart: always
    networks:
      - internal
    volumes:
      - dbdata:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    command:
      - mysqld
      - --max_allowed_packet=1024M
      - --explicit_defaults_for_timestamp=on
      - --innodb_buffer_pool_size=512M
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  ##############################################################################
  # OpenSearch 2.19
  ##############################################################################
  opensearch:
    image: opensearchproject/opensearch:2.19.0
    restart: always
    networks:
      - internal
    volumes:
      - osdata:/usr/share/opensearch/data
    environment:
      - discovery.type=single-node
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
      - plugins.security.disabled=true
      - DISABLE_SECURITY_PLUGIN=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  ##############################################################################
  # Valkey 8 (Redis-compatible — cache, FPC, sessions)
  ##############################################################################
  redis:
    image: valkey/valkey:8-alpine
    restart: always
    networks:
      - internal
    volumes:
      - redisdata:/data
    command: valkey-server --save 60 1 --loglevel warning

  ##############################################################################
  # RabbitMQ 3.13 — async message queue
  ##############################################################################
  rabbitmq:
    image: rabbitmq:3.13-alpine
    restart: always
    networks:
      - internal
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

##############################################################################
# Networks
##############################################################################
networks:
  internal:
    name: legal_internal
    internal: true    # no outbound internet access from app containers

##############################################################################
# Volumes
##############################################################################
volumes:
  media:          # pub/media — user-uploaded files, persists across deploys
  logs:           # var/log  — persists across container restarts
  dbdata:
  osdata:
  redisdata:
  rabbitmqdata:

##############################################################################
# BuildKit secrets
##############################################################################
secrets:
  composer_auth:
    file: ../auth.json
