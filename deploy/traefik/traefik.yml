# Traefik v3 static configuration
# Handles TLS termination and Let's Encrypt certificate management.

global:
  checkNewVersion: false
  sendAnonymousUsage: false

api:
  # Dashboard available at http://<VPS-IP>:8080 — restrict in firewall
  dashboard: true
  insecure: true

log:
  level: INFO

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true

  websecure:
    address: ":443"
    http:
      tls:
        certResolver: letsencrypt

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: legal_public

certificatesResolvers:
  letsencrypt:
    acme:
      # Replace with your real email for cert expiry notifications
      email: "admin@example.com"
      storage: "/letsencrypt/acme.json"
      httpChallenge:
        entryPoint: web
