# Magento 2 nginx vhost — production
# Receives requests from Varnish (internal network only).
# All HTTPS termination is handled by Traefik upstream.

upstream fastcgi_backend {
    server php-fpm:9000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    set $MAGE_ROOT /var/www/html;
    root $MAGE_ROOT/pub;

    index index.php;
    autoindex off;
    charset utf-8;

    # Tell Magento the real client IP passed by Traefik
    set_real_ip_from  0.0.0.0/0;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    # Varnish sends this header when it forwards to the backend
    set $MAGE_HTTPS "on";

    location /setup {
        root $MAGE_ROOT;
        location ~ ^/setup/index.php { deny all; }
        location ~ ^/setup/(?!pub/). { deny all; }
    }

    location /update {
        root $MAGE_ROOT;
        location ~ ^/update/index.php { deny all; }
        location ~ ^/update/(?!pub/). { deny all; }
    }

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location /pub {
        alias $MAGE_ROOT/pub;
        add_header X-Frame-Options "SAMEORIGIN";
    }

    location /static/ {
        expires max;
        location ~* \.(ico|jpg|jpeg|png|gif|svg|js|css|swf|eot|ttf|otf|woff|woff2)$ {
            add_header Cache-Control "public";
            add_header X-Frame-Options "SAMEORIGIN";
            expires +1y;
            try_files $uri $uri/ =404;
        }
        try_files $uri $uri/ =404;
    }

    location /media/ {
        try_files $uri $uri/ =404;
        # Catalog images can be large
        location ~* \.(ico|jpg|jpeg|png|gif|svg|webp)$ {
            add_header Cache-Control "public";
            expires +1y;
        }
    }

    location /media/customer/ { deny all; }
    location /media/downloadable/ { deny all; }
    location /media/import/ { deny all; }
    location /media/custom_options/ { deny all; }
    location /errors/  { try_files $uri =404; }

    # PHP handler
    location ~ ^/(index|get|static|errors/report|errors/404|errors/503|health_check)\.php$ {
        try_files $uri =404;

        fastcgi_pass   fastcgi_backend;
        fastcgi_index  index.php;

        fastcgi_param  PHP_FLAG  "session.auto_start=off \n suhosin.session.cryptua=off";
        fastcgi_param  PHP_VALUE "memory_limit=2G \n max_execution_time=600";
        fastcgi_read_timeout 600s;
        fastcgi_connect_timeout 600s;

        fastcgi_param  MAGE_MODE  production;
        fastcgi_param  HTTPS      on;

        fastcgi_buffer_size        64k;
        fastcgi_buffers            8 64k;
        fastcgi_busy_buffers_size  128k;

        include        fastcgi_params;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Block all other PHP files
    location ~* \.php$ { deny all; }

    # Deny dot-files
    location ~ /\. { deny all; }

    # Deny var and app directories
    location ~* ^/(var|generated|vendor|\.git|pub/errors) { deny all; }
}
